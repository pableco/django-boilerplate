[build]
builder = "NIXPACKS"

[deploy]
preDeployCommand = "python manage.py collectstatic --noinput && python manage.py migrate --no-input && python manage.py load_cards"
startCommand = "gunicorn composeexample.wsgi --bind 0.0.0.0:$PORT --log-file -"
healthcheckPath = "/inicio/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
