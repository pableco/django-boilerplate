[build]
builder = "NIXPACKS"

[deploy]
# Everything runs in the container that serves the app. No preDeployCommand:
# it runs in a separate container without the volume, so migrations there
# would land in a throwaway SQLite file.
startCommand = "python manage.py migrate --no-input && python manage.py load_cards && python manage.py create_superuser_if_none && python manage.py collectstatic --noinput && gunicorn composeexample.wsgi --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -"

healthcheckPath = "/inicio/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
